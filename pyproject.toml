[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coeos"
version = "0.23.0"
description = "CoeOS — passerelle BYOK auto-hébergée : route chaque requête vers le modèle prouvé meilleur sur cet axe, avec les clés du client, chez le client."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "OdyssAI" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["llm", "router", "openai", "byok", "gateway", "self-hosted", "benchmark"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
# La box tourne chez le client (clés BYOK + users + routing).
coeos-box = "coeos.__main__:main"
# Alias de transition depuis coeos-se ; retiré quand plus aucun déploiement ne l'utilise.
coeos-se = "coeos.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["coeos*"]

[tool.setuptools.package-data]
coeos = ["dashboard/*.html", "dashboard/images/*.png", "dashboard/images/*.svg", "settings/*.json"]
